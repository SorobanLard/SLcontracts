"name: CI\n\non:\n  push:\n    branches: [ main ]\n  pull_request:\n    branches: [ main ]\n\nenv:\n  CARGO_TERM_COLOR: always\n\njobs:\n  test:\n    name: Test Suite\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: stellar/actions/setup-rust@master\n        with:\n          rust-version: stable\n      - run: cargo test --verbose\n        env:\n          RUST_BACKTRACE: 1\n\n  clippy:\n    name: Clippy\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: stellar/actions/setup-rust@master\n        with:\n          rust-version: stable\n      - run: cargo clippy --all-targets --all-features -- -D warnings\n\n  fmt:\n    name: Format Check\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: stellar/actions/setup-rust@master\n        with:\n          rust-version: stable\n      - run: cargo fmt --all -- --check\n\n  coverage:\n    name: Code Coverage\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: stellar/actions/setup-rust@master\n        with:\n          rust-version: stable\n      - name: Install cargo-llvm-cov\n        run: cargo install cargo-llvm-cov\n      - name: Generate coverage\n        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info\n      - name: Upload coverage to Codecov\n        uses: codecov/codecov-action@v4\n        with:\n          files: ./lcov.info\n          fail_ci_if_error: false\n\n  wasm-build:\n    name: WASM Build (wasm32-unknown-unknown)\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: stellar/actions/setup-rust@master\n        with:\n          rust-version: stable\n      - name: Install wasm32 target\n        run: rustup target add wasm32-unknown-unknown\n      - name: Build WASM contracts\n        run: make build\n      - name: Check optimized WASM size\n        run: |\n          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do\n            size=$(stat -f%z \"$wasm\" 2>/dev/null || stat -c%s \"$wasm\" 2>/dev/null)\n            name=$(basename \"$wasm\")\n            echo \"$name: $size bytes\"\n            if [ \"$size\" -gt 262144 ]; then\n              echo \"ERROR: $name exceeds 256 KiB limit\"\n              exit 1\n            fi\n          done\n"